<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0a0b0d"><title>BTC Paper Trader · Desk</title>
<style>
:root{--bg:#0a0b0d;--p:#15171b;--p2:#1c1f24;--ln:#262a31;--tx:#e8eaed;--mu:#7d8590;--g:#39ff88;--r:#ff4d5e;--b:#4da3ff;--pu:#a78bfa;--c:#22d3ee;--o:#ffa94d;
--sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans)}
.w{max-width:1100px;margin:auto;padding:14px 12px 40px}.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}header h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--mu);font-size:12px}.sp{flex:1}.clk{color:var(--mu);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font:600 12px var(--sans);border:1px solid var(--ln);background:var(--p)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--mu)}.live{color:var(--g);border-color:#1f5c3a}.live i{background:var(--g);animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #39ff8899}70%{box-shadow:0 0 0 8px #39ff8800}100%{box-shadow:0 0 0 0 #39ff8800}}
.stale{color:var(--mu)}.pap{font-size:11px;color:var(--o);border:1px solid #5a3d1e;border-radius:99px;padding:3px 10px}
.tick{display:flex;gap:22px;overflow-x:auto;white-space:nowrap;background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:9px 14px;margin-bottom:12px;font-size:13px}
.tick b{font-weight:500;color:var(--mu);margin-right:6px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}@media(max-width:780px){.grid{grid-template-columns:1fr}}
.pn{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:14px;animation:fi .4s ease}@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.pn h2{margin:0 0 10px;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.big{font-size:38px;font-weight:600;letter-spacing:-.02em}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.pill{padding:3px 9px;border-radius:99px;background:var(--p2);font-size:12px}.up{color:var(--g)}.dn{color:var(--r)}.ne{color:var(--mu)}
svg{width:100%;height:130px;display:block;margin-top:10px}
.desk div.r{display:grid;grid-template-columns:12px 84px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.desk div.r:last-child{border:0}
.desk i{width:10px;height:10px;border-radius:3px}.desk .role{font-weight:600;font-size:13px}.desk .val{font-size:12px;color:#c5cad1;overflow-wrap:anywhere}
.log{max-height:300px;overflow-y:auto;font-size:12px}.log div{display:grid;grid-template-columns:auto auto 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--ln)}
.tg{font:600 10px var(--mono);padding:1px 6px;border-radius:5px;text-transform:uppercase}.t-state{color:var(--b);background:#4da3ff1a}.t-warn{color:var(--o);background:#ffa94d1a}.t-trade{color:var(--g);background:#39ff881a}.t-block{color:var(--r);background:#ff4d5e1a}.t-news{color:var(--pu);background:#a78bfa1a}
.bar{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;font-size:12px;margin:5px 0}.bar span{height:8px;border-radius:4px;background:var(--c);opacity:.85}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500}.tw{overflow-x:auto}
.mt{margin-top:12px}footer{color:var(--mu);font-size:11px;text-align:center;margin-top:16px}
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:9;max-width:92vw}
.toast{background:var(--p2);border:1px solid var(--ln);border-left:3px solid var(--b);border-radius:10px;padding:9px 12px;font-size:12px;animation:ti .3s ease,to .5s ease 6s forwards}
@keyframes ti{from{transform:translateX(30px);opacity:0}}@keyframes to{to{opacity:0;transform:translateX(30px)}}
</style></head><body><div class="w">
<header><div><h1>BTC Paper Trader</h1><div class="sub">Hyperliquid BTC · strict risk · paper only</div></div><div class="sp"></div>
<span class="pap">Paper trading only, virtual $100</span><span class="clk m" id="clk"></span><span class="badge stale" id="bd"><i></i>Stale</span></header>
<div class="tick m" id="tk">Loading…</div><div id="app"></div><footer id="ft"></footer></div><div id="toasts"></div>
<script>
const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(n,d=2)=>n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=n=>n==null?'—':(n<0?'-$':'$')+f(Math.abs(n)),sg=n=>n>0?'up':n<0?'dn':'ne',pm=n=>(n>0?'+':'')+f(n);
const mnl=(ms,s)=>ms?new Date(ms).toLocaleString('en-GB',{timeZone:'Asia/Manila',...(s?{hour:'2-digit',minute:'2-digit',second:'2-digit'}:{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}):'—';
const age=ms=>{if(!ms)return'—';const s=Math.max(0,Math.round((Date.now()-ms)/1e3));return s<90?s+'s':s<5400?Math.round(s/60)+'m':Math.round(s/3600)+'h'};
setInterval(()=>$('clk').textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Manila'})+' MNL',1000);
function curve(p){if(!p||p.length<2)return'';const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(y1-y0<.01){y0-=.5;y1+=.5}
const W=600,H=130,X=x=>(x-x0)/((x1-x0)||1)*W,Y=y=>H-6-(y-y0)/(y1-y0)*(H-12),d=p.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join('');
return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39ff88" stop-opacity=".25"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></linearGradient></defs><path d="${d}L${W} ${H}L0 ${H}Z" fill="url(#gg)"/><path d="${d}" fill="none" stroke="#39ff88" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="sub m">range ${usd(y0)} – ${usd(y1)} · ${p.length} pts</div>`}
function toast(m,c){const t=document.createElement('div');t.className='toast';t.style.borderLeftColor=c;t.innerHTML=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),7000)}
let prev=null,seen=null;
function render(s){
 const fresh=(Date.now()-(s.published_at||0))<180e3&&s.worker_running,bd=$('bd');bd.className='badge '+(fresh?'live':'stale');bd.innerHTML='<i></i>'+(fresh?'Live':'Stale');
 const ref=prev&&prev.btc_price!=null?prev.btc_price:s.prev_btc_price,ch=(s.btc_price!=null&&ref)?s.btc_price-ref:null;
 const sc={ACTIVE:'up',HALTED:'dn',PAUSED:'dn'}[s.state]||'ne';
 $('tk').innerHTML=`<span><b>BTC-PERP</b>${usd(s.btc_price)}</span>${ch!=null?`<span class="${sg(ch)}"><b>Δ since last</b>${pm(ch)} (${pm(ch/ref*100)}%)</span>`:''}<span><b>STATE</b><span class="${sc}">${esc(s.state)}</span></span><span><b>LEV</b>${s.leverage}x</span><span><b>HEARTBEAT</b>${age(s.heartbeat_ts)} ago</span>`;
 const pnl=s.equity-s.start,mult=s.equity/s.start,p=s.position,last=s.trades&&s.trades.length?s.trades[s.trades.length-1]:null,lsc=s.state_changes&&s.state_changes[s.state_changes.length-1];
 const halted=s.state==='HALTED',L=s.levels||{};
 const rows=[['var(--c)','Feed',`socket ${esc(s.socket||'?')} · ${s.reconnects??0} reconnects · hb ${age(s.heartbeat_ts)} ago`],
 ['var(--pu)','Levels',(L.support||L.resistance)?`S ${usd(L.support)} · R ${usd(L.resistance)} <span class="ne">(1h, approx)</span>`:''],
 ['var(--b)','Signal',s.pending?`pending ${esc(s.pending.direction||'')} setup${s.pending.entry_price?' @ '+usd(s.pending.entry_price):''}`:'no setup'],
 [halted?'var(--r)':'var(--g)','Risk',`${f(s.risk_pct)}%/trade · ${f(s.daily_limit_pct)}% daily · today <span class="${sg(s.daily_realized)}">${usd(s.daily_realized)}</span> / -${usd(s.start*s.daily_limit_pct/100)} · ${halted?'<span class="dn">HALTED</span>':'no halt'}`],
 ['var(--o)','Executor',p?`${esc(p.coin||'BTC')} ${esc(p.direction)} ${f(p.size,5)} @ ${usd(p.entry_price)} · SL ${usd(p.stop_price)} · TP ${usd(p.target_price)} · uPnL <span class="${sg(s.unrealized)}">${usd(s.unrealized)}</span>`:last?`flat · last: ${esc(last.dir)} ${usd(last.pnl)} (${esc(last.reason)})`:'flat · no trades yet'],
 ['var(--mu)','Logger',lsc?`${esc(lsc.from)} → ${esc(lsc.to)} · ${esc(lsc.reason)} · ${mnl(lsc.ts,1)}`:'']];
 let h=`<div class="grid"><div class="pn"><h2>Equity</h2><div class="big m">${usd(s.equity)}</div><div class="row m"><span class="${sg(pnl)}">${pm(pnl)} USD</span><span class="${sg(pnl)}">${pm(s.return_pct)}%</span><span class="pill">${f(mult,3)}x</span><span class="pill"><span class="up">${s.wins}W</span> / <span class="dn">${s.losses}L</span></span>${s.n_trades?`<span class="pill">win ${f(s.win_rate,1)}%</span><span class="pill">DD ${f(s.max_dd_pct)}%</span><span class="pill">fees ${usd(s.fees)}</span>`:''}</div>${curve(s.equity_series)}</div>
 <div class="pn desk"><h2>Desk</h2>${rows.map(r=>`<div class="r"><i style="background:${r[0]}"></i><span class="role">${r[1]}</span><span class="val m">${r[2]}</span></div>`).join('')}</div></div>`;
 const sy=Object.entries(s.symbols||{});if(sy.length)h+=`<div class="pn mt"><h2>Markets · ${sy.length} perps · shared $${f(s.start,0)} · max ${s.max_positions||1} open</h2><div class="tw"><table class="m"><tr><th>Coin</th><th>Price</th><th>State</th><th>Feed</th><th>Position</th></tr>${sy.map(([c,r])=>`<tr><td><b>${esc(c)}</b></td><td>${usd(r.price)}</td><td class="${r.state==='ACTIVE'?'up':r.state==='HALTED'?'dn':''}">${esc(r.state)}${r.reasons&&r.reasons.length?` <span class="ne">· ${esc(r.reasons.join(', '))}</span>`:''}</td><td>${r.stale?'<span class="dn">stale</span>':'live'}${r.trade_age_ms!=null?` <span class="ne">${(r.trade_age_ms/1000).toFixed(1)}s</span>`:''}</td><td>${r.position?`${esc(r.position.direction)} @ ${usd(r.position.entry_price)}`:r.pending?'pending setup':'flat'}</td></tr>`).join('')}</table></div></div>`;
 const ev=(s.events||[]).slice().reverse();
 h+=`<div class="grid mt">${ev.length?`<div class="pn"><h2>Event log</h2><div class="log m">${ev.map(e=>`<div><span class="ne">${mnl(e.ts,1)}</span><span class="tg t-${e.t}">${e.t}</span><span>${esc(e.msg)}${e.why?` <span class="ne">· ${esc(e.why)}</span>`:''}</span></div>`).join('')}</div></div>`:''}`;
 const wt=Object.entries(s.why_tally||{}).sort((a,b)=>b[1]-a[1]);if(wt.length){const mx=wt[0][1];h+=`<div class="pn"><h2>Why it waited</h2>${wt.map(([k,v])=>`<div class="bar m"><span class="ne" style="background:none;height:auto;opacity:1">${esc(k)}</span><span style="width:${v/mx*100}%"></span><b>${v}</b></div>`).join('')}<div class="sub">count of reasons on moves into PAUSED / WAIT / HALTED</div></div>`}
 h+='</div>';
 if(s.trades&&s.trades.length)h+=`<div class="pn mt"><h2>Trade history</h2><div class="tw"><table class="m"><tr><th>Closed</th><th>Coin</th><th>Side</th><th>Entry</th><th>Exit</th><th>Reason</th><th>Fees</th><th>Net</th></tr>${s.trades.slice().reverse().map(t=>`<tr><td>${mnl(t.exit_ts)}</td><td>${esc(t.coin||'BTC')}</td><td>${esc(t.dir)}</td><td>${usd(t.entry)}</td><td>${usd(t.exit)}</td><td>${esc(t.reason)}</td><td>${usd(t.fees)}</td><td class="${sg(t.pnl)}">${usd(t.pnl)}</td></tr>`).join('')}</table></div></div>`;
 $('app').innerHTML=h;$('ft').textContent=`snapshot ${mnl(s.published_at,1)} MNL (${age(s.published_at)} ago) · refresh 30s · real paper data only`;
 const last_ts=Math.max(0,...(s.events||[]).map(e=>e.ts));
 if(seen!=null)(s.events||[]).filter(e=>e.ts>seen).forEach(e=>toast(`<b>${esc(e.t.toUpperCase())}</b> ${esc(e.msg)}${e.why?' · '+esc(e.why):''}`,{trade:'#39ff88',block:'#ff4d5e',warn:'#ffa94d',news:'#a78bfa'}[e.t]||'#4da3ff'));
 seen=Math.max(seen||0,last_ts)}
let cur=null;async function load(){try{const r=await fetch('status.json?t='+Date.now(),{cache:'no-store'});const s=await r.json();if(cur&&s.published_at!==cur.published_at)prev={btc_price:cur.btc_price};cur=s;}catch(e){}if(cur)render(cur);}
load();setInterval(load,30000);
</script></body></html>
