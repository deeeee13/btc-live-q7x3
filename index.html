<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>BTC Paper Trader · Live</title>
<style>
:root{--bg:#f6f1ea;--card:#fffaf3;--ink:#2b2420;--mute:#8a7d72;--line:#e8ddd0;--acc:#b5793d;--up:#3f7d58;--dn:#b04a3f}
@media(prefers-color-scheme:dark){:root{--bg:#1c1815;--card:#26211d;--ink:#efe6dc;--mute:#a39486;--line:#3a322b;--acc:#d9a066;--up:#7cc196;--dn:#e07b6e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,"Iowan Old Style",serif}
.w{max-width:880px;margin:auto;padding:20px 16px 40px}h1{font-weight:normal;font-size:26px;margin:0}
.sub{color:var(--mute);font:13px system-ui,sans-serif;margin:4px 0 18px}.tag{display:inline-block;padding:2px 10px;border-radius:99px;border:1px solid var(--acc);color:var(--acc);font:12px system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font:600 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.k{color:var(--mute);font:12px system-ui,sans-serif}.v{font-size:20px}
.up{color:var(--up)}.dn{color:var(--dn)}table{width:100%;border-collapse:collapse;font:13px system-ui,sans-serif}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500}.tw{overflow-x:auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}footer{color:var(--mute);font:12px system-ui,sans-serif;text-align:center}
svg{width:100%;height:160px}
</style></head><body><div class="w">
<h1>BTC Paper Trader</h1><div class="sub"><span class="tag">Paper trading only, virtual $100</span> &nbsp;Hyperliquid BTC perp · times in Manila (UTC+8)</div>
<div id="app"><div class="card">Loading…</div></div>
<footer id="ft"></footer></div>
<script>
const $=s=>document.getElementById(s);
const fmt=(n,d=2)=>n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=n=>n==null?'—':(n<0?'-$':'$')+fmt(Math.abs(n));
const cls=n=>n>0?'up':n<0?'dn':'';
const mnl=ms=>ms?new Date(ms).toLocaleString('en-US',{timeZone:'Asia/Manila',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const age=ms=>{if(!ms)return'—';let s=Math.round((Date.now()-ms)/1000);return s<90?s+'s ago':s<5400?Math.round(s/60)+'m ago':Math.round(s/3600)+'h ago'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kv=(k,v,c='')=>`<div><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
function curve(pts){if(!pts||pts.length<2)return'';const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),W=600,H=160,p=8;
 const X=x=>p+(x-x0)/((x1-x0)||1)*(W-2*p),Y=y=>H-p-(y-y0)/((y1-y0)||1)*(H-2*p);
 const d=pts.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join(' ');
 return `<div class="card"><h2>Equity curve</h2><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"/></svg><div class="k">${usd(y0)} – ${usd(y1)}</div></div>`}
function render(s){
 const snapAge=(Date.now()-(s.published_at||0))/1000, stale=snapAge>180||!s.worker_running;
 let h=`<div class="card"><h2>Now</h2><div class="g">${kv('BTC price',usd(s.btc_price))}${kv('Bot state',esc(s.state)+(s.reason?`<div class="k">${esc(s.reason)}</div>`:''))}
 ${kv('Last heartbeat',age(s.heartbeat_ts))}${kv('Worker',`<span class="dot" style="background:var(--${stale?'dn':'up'})"></span>${stale?'stale':'running'}`)}</div></div>`;
 h+=`<div class="card"><h2>Account</h2><div class="g">${kv('Balance',usd(s.cash))}${kv('Equity',usd(s.equity))}${kv('Return',fmt(s.return_pct)+'%',cls(s.return_pct))}${kv('Realized P&L',usd(s.realized),cls(s.realized))}
 ${s.n_trades?kv('Win rate',fmt(s.win_rate,1)+'%')+kv('Trades',s.n_trades)+kv('Fees',usd(s.fees))+kv('Funding',usd(s.funding))+kv('Max drawdown',fmt(s.max_dd_pct)+'%'):''}</div></div>`;
 const p=s.position;if(p)h+=`<div class="card"><h2>Open position</h2><div class="g">${kv('Side',esc(p.direction)+' '+fmt(p.size,5))}${kv('Entry',usd(p.entry_price))}${kv('Stop',usd(p.stop_price))}${kv('Target',usd(p.target_price))}${kv('Unrealized',usd(s.unrealized),cls(s.unrealized))}${kv('Opened',mnl(p.entry_time))}</div></div>`;
 if(s.n_trades)h+=curve(s.equity_curve);
 if(s.trades&&s.trades.length)h+=`<div class="card"><h2>Trade history</h2><div class="tw"><table><tr><th>Closed</th><th>Side</th><th>Entry</th><th>Exit</th><th>Reason</th><th>Net P&L</th></tr>${s.trades.slice().reverse().map(t=>`<tr><td>${mnl(t.exit_ts)}</td><td>${esc(t.dir)}</td><td>${usd(t.entry)}</td><td>${usd(t.exit)}</td><td>${esc(t.reason)}</td><td class="${cls(t.pnl)}">${usd(t.pnl)}</td></tr>`).join('')}</table></div></div>`;
 if(s.state_changes&&s.state_changes.length)h+=`<div class="card"><h2>Recent state changes</h2><div class="tw"><table><tr><th>Time</th><th>Change</th><th>Reason</th></tr>${s.state_changes.slice().reverse().map(c=>`<tr><td>${mnl(c.ts)}</td><td>${esc(c.from)} → ${esc(c.to)}</td><td>${esc(c.reason)}</td></tr>`).join('')}</table></div></div>`;
 $('app').innerHTML=h;$('ft').textContent='Snapshot published '+age(s.published_at)+' · refreshes every 30s';}
let last=null;async function load(){try{const r=await fetch('status.json?t='+Date.now(),{cache:'no-store'});last=await r.json();}catch(e){}if(last)render(last);else $('app').innerHTML='<div class="card">Waiting for first status…</div>';}
load();setInterval(load,30000);
</script></body></html>
